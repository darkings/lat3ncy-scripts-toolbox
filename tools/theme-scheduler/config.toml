# ============================================================
# Theme Scheduler (Windows 主题 / 深浅色 / 壁纸自动调度配置)
# ============================================================

[general]
# 切换类型：
#   - "mode"  (深浅色模式切换：切换系统任务栏与应用深浅色，默认推荐)
#   - "theme" (完整主题切换：应用 .theme 官方或自定义主题包文件)
switch_type = "mode"

# 切换时是否弹出 HUD 提示通知 (☀️ 已切换为浅色模式 / 🌙 已切换为深色模式)
show_notification = true

[schedule]
# 触发机制：
#   - "sun"   (根据日出日落时间自动计算，每天动态对齐太阳作息)
#   - "fixed" (使用下方固定的固定时间)
trigger_mode = "sun"

# 手动经纬度（留空则根据当前公网 IP 自动获取所在城市日出日落）
latitude = ""    # 例: "31.2304" (上海)
longitude = ""   # 例: "121.4737"

# 备用 / 固定切换时间 (HH:mm)
fixed_light_time = "07:00"  # 白天 / 浅色切换时间
fixed_dark_time  = "19:00"  # 夜间 / 深色切换时间

# ============================================================
# 模式 A: 深浅模式配置 (当 switch_type = "mode" 时生效)
# ============================================================
[mode_settings]
switch_apps = true     # 是否切换应用程序 (Edge, Chrome, VS Code, 文件资源管理器等)
switch_system = false  # 是否切换系统任务栏、开始菜单、操作中心、托盘底色。false：系统壳保持当前深浅色，不重启 Explorer；只广播刷新应用窗口

# ============================================================
# 壁纸联动配置 (可选，支持独立开关)
# ============================================================
[wallpaper]
# 是否在切换时自动更换桌面壁纸 (true / false)
# true：日出/日落切换时按下面的 directory 轮换壁纸；锁屏是否跟随由 sync_lock_screen 控制
enabled = true

# 壁纸目录：目录内直接放图片，或建 light/day 与 dark/night 子目录分别放日/夜壁纸
# 留空则只能使用下面的显式路径
directory = "C:\\Users\\Jie\\Pictures\\Wallpaper"

# 多张候选时，light/dark 和 Raycast 的下一张都按文件名升序取当前壁纸的下一张。
# pick 已不再参与选图，保留只为兼容旧配置。

# 显式指定单张壁纸（优先级高于 directory；可填绝对路径，或相对 directory 的文件名）
light_wallpaper = ""

dark_wallpaper = ""

# 是否让锁屏背景跟随壁纸 (true / false)
# true：每次切换主题后同步锁屏；若启用了上面的壁纸联动，锁屏用同一张新壁纸，否则同步当前桌面壁纸。
# 走官方 WinRT API（按用户、免管理员），不写 PersonalizationCSP，不会把设置页变成「由组织管理」。
sync_lock_screen = true

# ============================================================
# 模式 B: 官方 / 自定义 .theme 主题包配置 (当 switch_type = "theme" 时生效)
# ============================================================
[theme_settings]
# 主题配置支持以下两种填写方式：
#   1. 仅填主题名：例如 "aero"、"dark"、"spotlight" -> 自动从 C:\Windows\Resources\Themes\ 寻找
#                 例如 "Light Theme"、"Dark Theme" -> 自动从系统用户主题目录寻找
#   2. 填完整绝对路径：例如 "C:\Windows\Resources\Themes\aero.theme" 或 "D:\Themes\MyTheme.theme"
light_theme_file = "light.theme"
dark_theme_file  = "dark.theme"

# ============================================================
# 鼠标方案联动（可选，独立于壁纸）
# ============================================================
[cursor]
# 切深浅色时同步换鼠标。false 则只切颜色/壁纸，不改光标。
enabled = true

# 配色方案名。对应 resources/cursors/<配色> 目录。
# 可用配色：light, dark, blueberry, greentea, mint, strawberry, thaitea, vanilla, yogurt
light_color = "light"
dark_color  = "dark"
# 光标目录。留空则按上面的配色自动解析为 resources/cursors/<配色>。
# 也可填相对仓库根的路径，或绝对路径（填了则忽略配色设置）。
light_dir = ""
dark_dir  = ""

# 写入「鼠标属性」方案名。只在本机注册表出现，不覆盖系统自带方案。
light_scheme = "Cursor Concept 3 Light"
dark_scheme  = "Cursor Concept 3 Dark"

# 尺寸由系统按 DPI 从多尺寸资源里选，脚本不写 CursorBaseSize / CursorSize。
# 资源包内含 32/48/64/96/128。本机 200% 缩放对应 64。
# 不要用 SetSystemCursor 强行塞句柄：DPI 不感知的 powershell.exe 会把 64 再放大成 128。
