<title>Toolbox browser selection fixture</title>
<style>body{font:18px system-ui;margin:2rem;max-width:56rem}textarea{font:inherit;width:100%;height:12rem}</style>
<h1>固定浏览器选区验收</h1>
<p>仅选择下方测试框：点击文本框、Ctrl+A，再触发 Caps+F。页面不访问网络，不读取剪贴板。</p>
<label for="fixture">固定中英文文本</label>
<textarea id="fixture" readonly>Toolbox browser validation.
浏览器选区验证：保留换行、竖线 | 和 emoji 🙂。
END-OF-BROWSER-FIXTURE</textarea>
<p>不要用整页全选替代文本框选区。结果仅用于确认跨应用交付，翻译服务可能收到以上固定文本。</p>
</html>
